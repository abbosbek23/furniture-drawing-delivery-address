[options]
; Mirrors the odoo:19 image defaults; core addons are still resolved from the
; odoo package path, this entry only adds the mounted custom addons directory.
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Master password for the database manager. Local demo value only.
admin_passwd = furniture-master

; Two databases are served: the seeded demo, and a clean one where the app can
; be installed from the Apps screen by hand.
dbfilter = ^furniture(_demo)?$
list_db = True

; Threaded mode's watchdog otherwise counts the long-lived /websocket request
; against this limit and reloads the server roughly every two minutes.
limit_time_real = 0
